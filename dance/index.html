<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen stage toy. The stage canvas takes all spare height, control deck docked below. */
  --night:#0F0920;
  --deck:#1A0E33;
  --line:#3B2866;
  --coral:#FF5D5D;
  --sun:#FFD23F;
  --aqua:#3DE0D0;
  --paper:#F3EEFF;
  --muted:#B1A3D6;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.app{height:100%;min-height:640px;max-width:880px;margin:0 auto;display:flex;flex-direction:column}

.stage{position:relative;flex:1 1 auto;min-height:280px;margin:12px 16px 0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#0B0619}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hud{position:absolute;top:10px;left:10px;display:flex;align-items:center;padding:7px 9px;border-radius:999px;background:rgba(15,9,32,.74);pointer-events:none}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
.go{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:68px;height:68px;display:grid;place-items:center;background:var(--coral);border:0;border-radius:50%;padding:0;box-shadow:0 5px 0 #A92C3A;cursor:pointer}
.go svg{width:32px;height:32px;margin-left:5px;fill:#2A0B14}
.go:active{transform:translate(-50%,3px);box-shadow:0 2px 0 #A92C3A}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);margin:0;font-size:12px;font-weight:600;color:var(--paper);background:rgba(15,9,32,.74);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
.hint.warn{background:var(--coral);color:#2A0B14}
.mini{position:absolute;top:8px;right:8px;font:600 12px/1 var(--body);color:var(--muted);background:rgba(15,9,32,.74);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.mini:disabled{opacity:.6;cursor:default}
.report{position:absolute;inset:8px;z-index:2;display:flex;flex-direction:column;gap:8px;padding:14px;border:2px solid var(--line);border-radius:12px;background:rgba(15,9,32,.96);font-size:13px;line-height:1.4;overflow:auto}
.report h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:var(--sun)}
.report .sum{margin:0;font-weight:700}
.report .sum.ok{color:var(--aqua)}
.report .sum.bad{color:var(--coral)}
.report ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.report li{display:grid;grid-template-columns:1.2em 1fr;gap:0 6px}
.report li b{color:var(--aqua)}
.report li.bad b{color:var(--coral)}
.report li small{grid-column:2;color:var(--muted);font-size:12px}
.report .btn{align-self:flex-start}

.deck{padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px}
.autos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.autos > *{min-height:34px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{position:relative;font:700 13px/1.1 var(--body);color:var(--muted);background:transparent;border:0;border-bottom:3px solid var(--line);min-height:34px;padding:4px 2px;cursor:pointer}
.tab[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--coral)}
.styles,.moves{transform-origin:50% 0}
.flip{animation:flip .28s ease-out}
@keyframes flip{from{transform:perspective(520px) rotateX(-80deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .flip{animation:none} }
@media (max-height:680px){ .stage{min-height:240px} }
.styles{display:flex;gap:6px;min-height:32px}
.moves{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:34px;gap:6px;min-height:74px}
.pill,.chip,.btn{position:relative;font:600 13px/1.1 var(--body);color:var(--paper);background:var(--deck);border:2px solid var(--line);cursor:pointer;padding:6px 4px}
.pill,.chip{font-size:12px;padding:4px 2px}
.pill{flex:1 1 auto;min-width:0;padding:4px 6px;white-space:nowrap;border-radius:999px;min-height:32px;background:transparent}
.pill[aria-pressed="true"]{background:var(--aqua);border-color:var(--aqua);color:#04201D}
.chip{border-radius:10px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#221300}
.live::after{content:"";position:absolute;top:-4px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--night)}
.tab.live::after{top:3px;right:5px}
.btn{border-radius:10px;min-height:38px;padding:6px 12px;white-space:nowrap}
.btn[aria-pressed="false"]{color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px}
.tempo{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
.tempo output{color:var(--paper);font-variant-numeric:tabular-nums;min-width:3ch}
.tempo input{flex:1 1 auto;min-width:60px;accent-color:var(--sun)}
button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
@media (min-width:640px){
  .moves{grid-template-columns:repeat(10,1fr);min-height:34px}
  .tabs{grid-template-columns:repeat(8,1fr)}
}
@media (max-width:379px){
  .pill{font-size:11px;padding:4px}
  .chip{font-size:11.5px}
}
</style>
</head>
<body>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const PI = Math.PI, TAU = PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const frac = v => v - Math.floor(v);
const mod = (a, n) => ((a % n) + n) % n;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const dip = b => .5 + .5 * Math.cos(TAU * b);            // 1 on the beat, 0 between beats
const hash = n => frac(Math.sin(n * 127.1 + 311.7) * 43758.5453);
const C = { coral:'#FF5D5D', sun:'#FFD23F', aqua:'#3DE0D0', paper:'#F3EEFF', violet:'#8E6BFF' };
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- sizing: a 400-unit-wide virtual scene, centred, background bleeds to the edges ---------- */
const VW = 400;
let cw = 1, ch = 1, dpr = 1, S = 1, ox = 0, VH = 470, X0 = 0, X1 = 400, FLOOR = 330;
function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  S = Math.min(cw / VW, ch / 470); ox = (cw - VW * S) / 2; VH = ch / S;
  X0 = -ox / S; X1 = (cw - ox) / S; FLOOR = VH - 140;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
window.addEventListener('resize', resize);
resize();

/* ---------- music styles and show structure ---------- */
const STYLES = {
  house:  { label:'House',  wall:'HOUSE',   bpm:126, vol:1.5, cols:['#FFD23F', '#3DE0D0', '#FF5D5D', '#8E6BFF'] },
  techno: { label:'Techno', wall:'TECHNO', bpm:134, vol:1.5, cols:['#3DE0D0', '#F3EEFF', '#4D7CFF', '#8E6BFF'] },
  dub:    { label:'Dub',    wall:'DUB',   bpm:140, vol:1.15, cols:['#5FE08A', '#FFD23F', '#FF5D5D', '#2FBF71'] },
  bass:   { label:'Bass',   wall:'BASS',     bpm:140, vol:1, cols:['#FF4FD8', '#8E6BFF', '#4D7CFF', '#FF5D5D'] },
  // public-domain classics: Tchaikovsky (Swan Lake 1877, The Nutcracker 1892), Offenbach (1858), Grieg (1875)
  swan:     { label:'Swan Lake', wall:'SWAN LAKE',     bpm:108, vol:.42, classical:true, costume:'tutu', cols:['#BFE3FF', '#F3EEFF', '#FFB7D5', '#8E6BFF'] },
  cygnets:  { label:'Cygnets',   wall:'CYGNETS',  bpm:108, vol:.5, classical:true, costume:'tutu', cols:['#FFB7D5', '#F3EEFF', '#BFE3FF', '#FFD23F'] },
  cancan:   { label:'Can-can',   wall:'CAN-CAN',       bpm:152, vol:.85, classical:true, costume:'tutu', cols:['#FF5D5D', '#FFD23F', '#FF4FD8', '#F3EEFF'] },
  trepak:   { label:'Trepak',    wall:'TREPAK',        bpm:150, vol:1, classical:true, costume:'hat',  cols:['#FF5D5D', '#F3EEFF', '#FFD23F', '#4D7CFF'] },
  mountain: { label:'Mtn King',  wall:'MOUNTAIN KING', bpm:100, accel:9, vol:1, classical:true, cols:['#5FE08A', '#FF9A3D', '#8E6BFF', '#FF5D5D'] },
  // hip hop, funk and country: original grooves written for this page
  hiphop:    { label:'Boom bap',   wall:'BOOM BAP', bpm:94,  vol:1.2, costume:'cap', cols:['#FFD23F', '#FF5D5D', '#3DE0D0', '#F3EEFF'] },
  trap:      { label:'Trap',       wall:'TRAP',  bpm:140, vol:1.25, costume:'cap', cols:['#FF5D5D', '#8E6BFF', '#FF4FD8', '#4D7CFF'] },
  funk:      { label:'Funk',       wall:'FUNK',  bpm:112, vol:1.35, costume:'cap', cols:['#FF9A3D', '#FFD23F', '#FF4FD8', '#3DE0D0'] },
  honkytonk: { label:'Honky tonk', wall:'HONKY TONK',  bpm:120, vol:1.5, tune:true, costume:'cowboy', cols:['#FFB347', '#FFD23F', '#FF5D5D', '#F3EEFF'] },
  hoedown:   { label:'Hoedown',    wall:'HOEDOWN',  bpm:132, vol:.8, tune:true, costume:'cowboy', cols:['#FFD23F', '#5FE08A', '#FF9A3D', '#F3EEFF'] },
  // pop, shuffle and disco: more original grooves. The jig is "The Irish Washerwoman", a traditional tune first printed in 1788
  synthpop: { label:'Synth pop',     wall:'SYNTH POP',       bpm:116, vol:1.35, costume:'fedora', cols:['#FF4FD8', '#3DE0D0', '#FFD23F', '#8E6BFF'] },
  rnb:      { label:'R&B',           wall:'R&B',    bpm:104, vol:1.45, costume:'fedora', cols:['#F3EEFF', '#FF4FD8', '#8E6BFF', '#FFD23F'] },
  latin:    { label:'Latin pop',     wall:'LATIN POP',         bpm:104, vol:.8, tune:true, costume:'fedora', cols:['#FF5D5D', '#FFD23F', '#5FE08A', '#FF9A3D'] },

    if (c >= 4){ p.lS = p.rS = 1.45 + .12 * Math.sin(TAU * b); p.lE = p.rE = .15; p.face = 'joy'; p.mouth = .9; }
  },
  tstep(b, p){                                   // the T-step on its own: four beats across the stage, four back
    const c = mod(b, 8), d = c < 4 ? 1 : -1, u = c % 4;
    tStep(u * 2, d, p); p.mouth = .65;
    return d * (-36 + 18 * u);
  },
  charleston(b, p){                              // swing step: kick out front, step, flick up behind, step, on swivelling feet with the arms swinging across
    const i = mod(Math.floor(b), 4), k = Math.sin(PI * frac(b)), sw = Math.sin(TAU * b), a = Math.sin(PI * b);
    p.y = -8 - 4 * dip(2 * b); p.lToe = .1 + .75 * sw; p.rToe = .1 - .75 * sw;                  // heels in, heels out
    p.lS = .55 + .5 * a; p.rS = .55 - .5 * a; p.lE = .9 + .3 * a; p.rE = .9 - .3 * a; p.shTilt = .08 * a; p.head = .06 * a;
    if (i === 1){ p.rfx = 13 + 12 * k; p.rfy = 24 * k; p.rz = 1; p.rK = .2; p.rToe = .9; }
    else if (i === 3){ p.lfx = -13 + 6 * k; p.lfy = 20 * k; p.lz = -1; p.lK = 1; p.lToe = .2; }
    else if (i === 0) p.lfy = 5 * k; else p.rfy = 5 * k;
    p.face = 'joy'; p.mouth = .8;
  },
  rubber(b, p){                                  // bee's knees, the hands swapping from knee to knee, then loose rubber legs
    const c = mod(b, 8);
    if (c < 4){
      const k = Math.cos(TAU * b), x = k < 0;                                                   // knees apart on the beat, knocked together between beats
      p.y = -30; p.lfx = -15; p.rfx = 15; p.lK = p.rK = k; p.lToe = p.rToe = .4 + .3 * k;
      p.lS = p.rS = x ? -.28 : .38; p.lE = p.rE = x ? -.25 : .15; p.head = .05 * k; p.mouth = .85; p.brow = .6;
    } else {
      const s = Math.sin(TAU * b), s2 = Math.sin(PI * b);
      p.y = -12 - 4 * Math.abs(s); p.lfx = -13; p.rfx = 13; p.lK = s; p.rK = -s; p.x = -7 * s; p.lean = .1 * s2; p.head = -.1 * s2;
      p.lS = .7 + .4 * s2; p.rS = .7 - .4 * s2; p.lE = p.rE = .5; p.face = 'joy'; p.mouth = 1;
    }
  },
  sidekick(b, p){                                // hop on one foot while the other kicks out to the side, a new side every beat
    const L = Math.floor(b) % 2 === 0, k = Math.sin(PI * frac(b)), d = L ? -1 : 1, A = L ? ['l', 'r'] : ['r', 'l'];
    p.y = 9 * k - 4; p.lean = -d * .1 * k; p.x = -d * 5 * k; p.head = d * .05;
    p[A[0] + 'fx'] = d * (11 + 27 * k); p[A[0] + 'fy'] = 4 + 14 * k; p[A[0] + 'K'] = .15; p[A[0] + 'Toe'] = 1;
    p[A[1] + 'fx'] = -d * 3; p[A[1] + 'fy'] = 8 * k; p[A[1] + 'K'] = .5;
    p.lS = p.rS = .9 + .35 * k; p.lE = p.rE = 1 - .5 * k; p.face = 'joy'; p.mouth = .9;
  },
  xjump(b, p){                                   // jump the feet crossed, jump them wide, with the arms flying out on the wide ones
    const i = Math.floor(b), f = frac(b), k = Math.sin(PI * f), q = easeOut(f / .3), o = i % 2 === 1 ? q : 1 - q, sg = mod(i, 4) < 2 ? 1 : -1;
    p.y = 12 * k - 5 * (1 - k); p.lfy = p.rfy = 9 * k;
    p.lfx = lerp(sg * 6, -22, o); p.rfx = lerp(-sg * 6, 22, o); p.lz = sg * (1 - o); p.rz = -sg * (1 - o);
    p.lS = p.rS = lerp(.4, 1.5, o); p.lE = p.rE = lerp(-1.2, .1, o); p.face = 'joy'; p.mouth = .5 + .4 * o;
  },

  /* disco */
  hustle(b, p){                                  // a disco travelling turn: step, spin, step, then freeze with one finger pointed at the ceiling
    const c = mod(b, 8), d = c < 4 ? 1 : -1, u = c % 4, A = d > 0 ? ['r', 'l'] : ['l', 'r'];
    p.y = -6 - 4 * dip(b); p.turn = d * .7;
    if (u < 3){
      p[A[Math.floor(u) % 2] + 'fy'] = 7 * Math.sin(PI * frac(b));
      if (u >= 1 && u < 2) p.flip = Math.cos(TAU * ease(u - 1));
      p.lS = p.rS = .75; p.lE = p.rE = -1.7 + .4 * Math.sin(TAU * b); p.lean = d * .05;
    } else {
      const q = easeOut((u - 3) / .25);
      p[A[0] + 'S'] = lerp(.75, 2.55, q); p[A[0] + 'E'] = .08; p[A[1] + 'S'] = .8; p[A[1] + 'E'] = -1.45;
      p.x = -d * 7 * q; p.lean = d * .07 * q; p.head = -d * .08; p[A[1] + 'fx'] = -d * 22; p[A[1] + 'Toe'] = 1; p.face = 'joy'; p.mouth = 1;
    }

  },
  bump(b, p){                                    // the bump: hips thrown out to one side twice, then twice to the other
    const f = frac(b), d = mod(Math.floor(b), 4) < 2 ? 1 : -1, hit = easeOut(f / .2) * (1 - ease(clamp((f - .55) / .45, 0, 1))), a = Math.sin(PI * b);
    p.x = d * 13 * hit; p.hipTilt = -d * .1 * hit; p.lean = -d * .1 * hit; p.head = d * .06 * hit; p.y = -10 - 3 * hit;
    p.lfx = -17; p.rfx = 17; p.lK = p.rK = .7;
    p.lS = .6 + .15 * a; p.rS = .6 - .15 * a; p.lE = p.rE = 1.5; p.turn = d * .5; p.mouth = .6 + .3 * hit; p.brow = .4;
  },
  roll(b, p){                                    // fists rolling round each other, climbing from one hip to the far shoulder, finished with a point
    const c = mod(b, 8), d = c < 4 ? 1 : -1, u = c % 4, A = d > 0 ? ['r', 'l'] : ['l', 'r'], g = TAU * 2 * b;
    p.y = -8 - 4 * dip(b); p.lfx = -15; p.rfx = 15;
    if (u < 3){

    } else {
      p[A[0] + 'S'] = 2.5; p[A[0] + 'E'] = .05; p[A[1] + 'S'] = .8; p[A[1] + 'E'] = -1.45;

    }
  },

  /* Irish step dance */
  jigstep(b, p){                                 // hop and cut (the foot whipped up across the other knee), hop and point, then the other leg
    const i = mod(Math.floor(b), 4), d = i < 2 ? 1 : -1, A = d > 0 ? ['r', 'l'] : ['l', 'r'], hop = Math.sin(PI * frac(2 * b)), q = easeOut(frac(b) / .25);
    stiff(p); p.y = 3 + 6 * hop; p[A[1] + 'fy'] = 5 * hop; p[A[1] + 'fx'] = -d * 4; p[A[0] + 'z'] = 1;
    if (i % 2 === 0){ p[A[0] + 'fx'] = d * lerp(12, -3, q); p[A[0] + 'fy'] = 34 * q + 4 * hop; p[A[0] + 'K'] = 1; }
    else { p[A[0] + 'fx'] = d * lerp(0, 24, q); p[A[0] + 'fy'] = 1 + 3 * hop; p[A[0] + 'K'] = .1; p[A[0] + 'Toe'] = 1; }
  },
  sevens(b, p){                                  // seven quick crossing steps to the side on the toes, a hop with the back foot up, and back again
    const c = mod(b, 8), d = c < 4 ? 1 : -1, u = c % 4, g = u * 2, k = Math.sin(PI * frac(g)), A = d > 0 ? ['r', 'l'] : ['l', 'r'];
    stiff(p); p.y = 3 + 3 * k; p.turn = d * .4; p[A[1] + 'z'] = -1;
    if (u >= 3.5){ p.y = 3 + 12 * k; p[A[1] + 'fy'] = 26 * k; p[A[1] + 'K'] = 1; p[A[1] + 'fx'] = d * 2; p[A[0] + 'fy'] = 9 * k; }
    else if (Math.floor(g) % 2 === 0){ p[A[0] + 'fx'] = d * (8 + 8 * k); p[A[0] + 'fy'] = 6 * k; p[A[1] + 'fx'] = d * 2; }
    else { p[A[1] + 'fx'] = d * (2 - 6 * k); p[A[1] + 'fy'] = 6 * k; p[A[0] + 'fx'] = d * 10; }
    return d * (-45 + 90 * Math.min(1, u / 3.5));
  },
  trebles(b, p){                                 // hard-shoe trebles: three beats of rattling heel and toe taps, then a high kick
    const c = mod(b, 4), d = mod(Math.floor(b / 4), 2) === 0 ? 1 : -1, A = d > 0 ? ['r', 'l'] : ['l', 'r'];

    } else {
      const k = Math.sin(PI * (c - 3));

      p.lean = -d * .08 * k; p.face = 'joy'; p.mouth = 1;
    }
  }
};

/* one-beat flourishes that carry him from one move into the next */
const TRANS = {
  spin(q, p){ p.flip = Math.cos(TAU * ease(q)); p.lS = p.rS = .55; p.lE = p.rE = -1.9; p.lfx = -7; p.rfx = 7; p.y = 3 * Math.sin(PI * q); p.lToe = p.rToe = .2; },
  clap(q, p){ const c = Math.abs(Math.sin(TAU * q)); p.lS = p.rS = lerp(2.95, 2.4, c); p.lE = p.rE = lerp(.95, .2, c); p.y = 7 * c; p.lfy = p.rfy = 5 * c; p.face = 'joy'; p.mouth = 1; },
  drop(q, p){ p.y = q < .65 ? -30 * ease(q / .65) : lerp(-30, 6, ease((q - .65) / .35)); p.lfx = -22; p.rfx = 22; p.lS = p.rS = .35; p.lE = p.rE = q < .65 ? -.5 : .9; p.face = 'ooh'; },
  point(q, p, par){
    const d = par ? -1 : 1;
    if (d > 0){ p.rS = 2.35; p.rE = .05; p.lS = -2; p.lE = .1; } else { p.lS = 2.35; p.lE = .05; p.rS = -2; p.rE = .1; }
    p.x = -d * 9; p.lean = -d * .08; p.turn = d * .9; p.head = -d * .1; p.y = -4; p.brow = .8;
  }
};
function star(p, k){                             // k: 0 on the ground, 1 at the top of the jump
  p.y = 50 * k; p.lfy = p.rfy = 38 * k; p.lfx = -15 - 11 * k; p.rfx = 15 + 11 * k;
  p.lS = p.rS = lerp(1.2, 2.45, k); p.lE = p.rE = .1; p.lK = p.rK = .9;
  p.face = 'joy'; p.mouth = 1; p.sy = 1 + .05 * k; p.sx = 1 - .03 * k;
}

function targetPose(){
  const p = basePose();
  let ax = STEPX, level = STEPDROP, lift = 0, tx = 0;
  if (!started){
    const t = idleT; phase = 'idle';
    p.mouth = 0; p.turn = .5; p.y = 1.5 * Math.sin(t * 2.2); p.head = .05 * Math.sin(t * 1.3);
    if (t % 5.5 < 2.6){ p.rS = 2.45 + .28 * Math.sin(t * 7); p.rE = .25 + .3 * Math.sin(t * 7 + 1.2); p.head += .08; p.mouth = .5; }
  } else if (beat < DROP){
    const b = beat; phase = 'intro'; p.turn = .6;
    if (b < 1){                                   // get to the side step (a small hop, or a flip back down on an encore)
      const q = ease(b), far = Math.abs(introFrom.x - STEPX) > 20;
      ax = lerp(introFrom.x, STEPX, q); level = lerp(introFrom.level, STEPDROP, q);
      lift = 4 * (far ? 72 : 18) * b * (1 - b);
      p.lS = p.rS = far ? 2.3 : 1.2;
      p.lfy = p.rfy = Math.sin(PI * b) * (far ? 16 : 8);
      if (far) p.rot = -TAU * ease(b);
    } else if (b < 3){                            // wind up
      const q = ease((b - 1) / 2);
      p.y = -26 * q - 4 * dip(b);
      p.lS = p.rS = lerp(.5, .9, q); p.lE = p.rE = lerp(.2, -1.2, q);
      p.head = .12; p.lean = .05 * q; p.browT = -q; p.mouth = .2; p.lfx = -16; p.rfx = 16;
    } else {                                      // the hop up onto the stage
      const q = b - 3;
      ax = lerp(STEPX, CX, q); level = lerp(STEPDROP, 0, q); lift = 4 * 104 * q * (1 - q);
      p.rot = TAU * ease(q); p.lS = p.rS = 2.75; p.lE = p.rE = .15;
      p.lfy = p.rfy = 18 * Math.sin(PI * q); p.sx = .95; p.sy = 1.06; p.face = 'joy'; p.mouth = 1;
    }
  } else {
    ax = CX; level = 0;
    const lb = beat - DROP, rel = lb - sec.start, toDrop = next.at - lb;
    if (sec.start === 0 && lb < 2){               // landing pose after the hop
      phase = 'land';
      const sq = 1 - easeOut(lb / .6);
      p.sy = 1 - .2 * sq; p.sx = 1 + .14 * sq; p.y = -14 * sq - 3 * dip(lb);
      p.lS = p.rS = 2.25; p.lE = p.rE = .25; p.head = .06 * Math.sin(PI * lb);
      p.lfx = -20; p.rfx = 20; p.face = 'joy'; p.mouth = 1;
    } else if (toDrop <= next.build){             // build: sink low and shake, then leap into the drop
      phase = 'build';
      const q = clamp(1 - toDrop / next.build, 0, 1), tr = Math.sin(TAU * lb * 4) * q;
      p.y = -10 - 22 * q + 1.5 * tr; p.lfx = -21; p.rfx = 21; p.x = 2 * tr;
      p.lS = p.rS = .45 + .55 * q; p.lE = p.rE = .5 + 1.3 * q + .1 * tr;
      p.head = .03 * tr; p.face = 'ooh'; p.browT = -1; p.brow = -.5;
      if (toDrop < .5) star(p, Math.cos(PI * toDrop));
    } else {
      let trans = null;
      if (mode === 'auto'){
        const list = AUTO_MOVES[sec.style], ph = Math.floor(rel / 8), inPh = rel - ph * 8;
        const base = STYLES[sec.style].classical ? 0 : phraseBase;        // the classics always open with their own dance
        moveName = list[(base + ph) % list.length];
        if (inPh >= 7 && list[(base + ph + 1) % list.length] !== moveName) trans = { q: inPh - 7, kind: KINDS[(phraseBase + ph) % KINDS.length], par: ph % 2 === 1 };
      } else {
        moveName = manualMove;
        if (sw) trans = { q: (lb - sw.start) / (sw.at - sw.start), kind: sw.kind, par: sw.par };
      }
      if (trans){ phase = 'trans'; TRANS[trans.kind](clamp(trans.q, 0, 1), p, trans.par); }
      else { phase = 'move'; tx = MOVES[moveName](rel, p) || 0; }
      if (sec.start > 0 && rel < .5){ phase = 'drop'; star(p, Math.cos(PI * rel)); }
      else if (sec.start > 0 && rel < 1){ const sq = 1 - easeOut((rel - .5) / .4); p.sy *= 1 - .16 * sq; p.sx *= 1 + .1 * sq; p.y -= 10 * sq; }
    }
    // small human drift so loops never repeat exactly
    const t = idleT;
    p.lean += .012 * Math.sin(t * .83) + .008 * Math.sin(t * 1.31 + 2);
    p.head += .025 * Math.sin(t * 1.07 + 1);
    if (p.mouth > .15) p.mouth = clamp(p.mouth + .12 * dip(lb), 0, 1);
  }
  // hips and shoulders tilt against each other as the weight shifts
  p.hipTilt += -p.x * .012; p.shTilt += p.x * .009;
  p.sy *= 1 + .06 * pop;
  return { p, ax, level, lift, tx };
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function cap(x1, y1, r1, x2, y2, r2, col){       // a tapered limb segment with round ends
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = col; ctx.beginPath();
  ctx.arc(x1, y1, r1, a + PI / 2, a - PI / 2);
  ctx.arc(x2, y2, r2, a - PI / 2, a + PI / 2);
  ctx.closePath(); ctx.fill();
}
function oval(x, y, rx, ry, rot, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, TAU); ctx.fill(); }

function drawBackdrop(b, t, cols){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0B0619'); g.addColorStop(.7, '#1C0E38'); g.addColorStop(1, '#2A1245');
  ctx.fillStyle = g; ctx.fillRect(X0, 0, X1 - X0, VH);

  // LED wall with a level meter
  const wx = 34, wy = 36, ww = 332, wh = Math.max(60, FLOOR - 16 - wy);
  ctx.fillStyle = '#150B2C'; rr(wx, wy, ww, wh, 10); ctx.fill();
  ctx.save(); rr(wx, wy, ww, wh, 10); ctx.clip();
  const n = 16, bw = ww / n, rise = phase === 'build' ? clamp(1 - (next.at - (beat - DROP)) / next.build, 0, 1) : 0;
  for (let i = 0; i < n; i++){
    const wob = .5 + .5 * Math.sin(t * 2.1 + i * 1.9) * Math.sin(t * 1.3 + i * .7);
    const h = wh * .1 + wh * .6 * Math.max(energy * wob * (.45 + .55 * Math.pow(dip(b), 2)), rise * (.5 + .5 * wob));
    ctx.fillStyle = cols[i % 3];
    ctx.globalAlpha = .12 + .18 * energy;
    for (let y = wy + wh - 6; y > wy + wh - 6 - h; y -= 9) ctx.fillRect(wx + i * bw + 3, y - 6, bw - 6, 6);
  }
  ctx.globalAlpha = 1; ctx.restore();
  ctx.strokeStyle = '#3B2866'; ctx.lineWidth = 2; rr(wx, wy, ww, wh, 10); ctx.stroke();

  if (started && beat >= DROP){                    // the screen names what is playing: the music, and under it the dance
    const glow = .5 + .3 * dip(b);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = hexA(C.paper, glow);
    ctx.font = '13px "Bowlby One","Arial Black",Impact,sans-serif';
    ctx.fillText(STYLES[sec.style].wall, 200, wy + 30);
    const dance = LABEL[moveName].toUpperCase();
    if ((phase === 'move' || phase === 'trans' || phase === 'drop') && dance !== STYLES[sec.style].wall){   // no echo when the dance shares the music's name
      ctx.fillStyle = hexA(C.paper, glow * .75);
      ctx.font = '10px "Bowlby One","Arial Black",Impact,sans-serif';
      ctx.fillText(dance, 200, wy + 49);
    }
  }

  ctx.fillStyle = '#07040F'; ctx.fillRect(X0, 10, X1 - X0, 7);   // lighting truss
}

function drawLights(t, b, cols){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const strobe = !reduce && sec.style === 'techno' && phase !== 'idle' ? .75 + .5 * Math.pow(dip(b), 4) : 1;
  const e = energy * strobe;
  const i0 = Math.floor(X0 / 100) - 1, i1 = Math.ceil(X1 / 100) + 1;
  for (let i = i0; i <= i1; i++){
    const lx = i * 100 + 50, col = cols[mod(i, 4)];
    const sway = reduce ? .3 * Math.sin(i * 2.1) : Math.sin(t * (.7 + .13 * mod(i, 3)) + i * 2.1);
    const tx = lx + sway * 95 * energy;
    const g = ctx.createLinearGradient(lx, 16, tx, FLOOR);
    g.addColorStop(0, hexA(col, .36 * e)); g.addColorStop(1, hexA(col, .02));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(lx - 4, 16); ctx.lineTo(lx + 4, 16); ctx.lineTo(tx + 46, FLOOR + 8); ctx.lineTo(tx - 46, FLOOR + 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = hexA(col, clamp(.45 + .5 * e, 0, 1));
    ctx.beginPath(); ctx.arc(lx, 17, 4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawFollowSpot(bx, by){
  const a = .55 + .45 * energy;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(200, 16, bx, by);
  g.addColorStop(0, `rgba(255,244,214,${.26 * a})`); g.addColorStop(1, `rgba(255,244,214,${.05 * a})`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(196, 16); ctx.lineTo(204, 16); ctx.lineTo(bx + 62, by + 6); ctx.lineTo(bx - 62, by + 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255,244,214,${.15 * a})`;
  ctx.beginPath(); ctx.ellipse(bx, by + 3, 64, 9, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawStage(b, cols){
  let g = ctx.createLinearGradient(0, FLOOR - 10, 0, FLOOR + 12);
  g.addColorStop(0, '#3A2068'); g.addColorStop(1, '#56309A');

function drawCrowd(b, t){

/* ---------- the dancer: an invented cartoon character ---------- */
const D = { HIP: 80, T: 50, L1: 38, L2: 38, U: 28, F: 26, SCALE: 1.12 };
const SK = '#C28860', SKD = '#A46C48', HAIR = '#F4C651', HAIRD = '#D9A63A', FADE = '#3A2418', INK = '#2A160E';

function drawLeg(hx, hy, fx, fy, side, k, toe, lift, z, pt, heel){
  const dx = fx - hx, dy = fy - hy;
  let d = Math.hypot(dx, dy) || .001;

  const kx = hx + ux * a + px * h * k, ky = hy + uy * a + py * h * k;

  ctx.scale(sc, sc); ctx.rotate((clamp(lift * .03, 0, .5) + 1.15 * pt - .7 * heel) * sgn);   // pt: up on the toes; heel: heel dug in, toes up
  const x0 = sgn > 0 ? -6.5 : -len, w = len + 6.5;
  ctx.fillStyle = C.sun; rr(x0, -3, w, 10, 5); ctx.fill();
  ctx.fillStyle = C.paper; rr(x0, 4.5, w, 3.2, 1.6); ctx.fill();
  ctx.restore();
}

function drawArm(side, s, e, shx, shy){
  shy -= 3 * clamp((s - 1.2) / 1.2, 0, 1);       // shoulders lift a little when the arm goes up
  const elx = shx + side * Math.sin(s) * D.U, ely = shy + Math.cos(s) * D.U;
  const dxh = side * Math.sin(s + e), dyh = Math.cos(s + e);
  const wx = elx + dxh * D.F, wy = ely + dyh * D.F;
  cap(shx, shy, 7.4, elx, ely, 6.2, SUIT); cap(elx, ely, 6.2, wx, wy, 5, SUIT);
  cap(wx - dxh * 2.5, wy - dyh * 2.5, 5.2, wx + dxh * 1.5, wy + dyh * 1.5, 5, C.paper);
  const px = wx + dxh * 7.5, py = wy + dyh * 7.5;
  oval(px, py, 6.4, 5.3, Math.atan2(dyh, dxh), SK);
  oval(px - dyh * side * 4.6 - dxh * 1.5, py + dxh * side * 4.6 - dyh * 1.5, 2.6, 2.6, 0, SK);

}
function drawRope(x, y, ph){                     // a lasso loop spinning above the roping hand

  const lx = rx * Math.cos(ph), ly = ry * Math.sin(ph), ex = cx + lx * Math.cos(tilt) - ly * Math.sin(tilt), ey = cy + lx * Math.sin(tilt) + ly * Math.cos(tilt);

    check('Buttons', STYLES[s].bpm >= +tempo.min && STYLES[s].bpm <= +tempo.max, 'the style "' + s + '" has a tempo the slider cannot show');
    check('Buttons', !STYLES[s].costume || STYLES[s].costume in wear, 'the style "' + s + '" asks for an unknown costume');
    check('Buttons', (AUTO_MOVES[s] || []).every(m => TAB_OF_MOVE[m] === TAB_OF[s]), 'the style "' + s + '" has an Auto mix move on another page');
  }
  for (const el of [...chips, ...pills]) check('Buttons', tabIds.includes(el.dataset.tab), 'the button "' + el.textContent + '" is in no tab');
  // 2. each move, sampled over 16 beats: the pose stays a real, reachable pose, he stays on the stage, and the loop closes without a jump
  const poseAt = (m, b) => { const p = basePose(); return { p, tx: MOVES[m](b, p) || 0 }; };
  for (const m in MOVES){
    let why = '';
    for (let b = 0; b <= 16 && !why; b += 1 / 16){
      const { p, tx } = poseAt(m, b), f = NUM.find(x => !isFinite(p[x]));
      if (f) why = f + ' is not a number at beat ' + b;
      else if (!(Math.abs(tx) <= 84)) why = 'he leaves the stage at beat ' + b;
      else if (Math.abs(p.x) > 40 || p.y < -60 || p.y > 80 || Math.abs(p.lfx) > 90 || Math.abs(p.rfx) > 90 || Math.abs(p.lean) > .6) why = 'the pose is out of range at beat ' + b;
    }
    if (!why){ const a = poseAt(m, 0), z = poseAt(m, 16); if (Math.abs(a.tx - z.tx) > .01 || NUM.some(x => Math.abs(a.p[x] - z.p[x]) > .01)) why = 'the loop jumps after 16 beats'; }
    check('Moves', !why, m + ': ' + why);
  }
  for (const kind of KINDS) for (const par of [false, true]){
    let ok = true;
    for (let q = 0; q <= 1; q += .05){ const p = basePose(); TRANS[kind](q, p, par); if (NUM.some(x => !isFinite(p[x]))) ok = false; }
    check('Moves', ok, 'the "' + kind + '" flourish breaks the pose');
  }
  // 3. each music style, rendered offline: it makes sound, has no broken samples, does not clip, and is as loud as the others on a phone speaker
  for (const s in STYLES){
    let r = null, err = '';
    try { r = await renderStyle(s, 2); } catch (e){ err = String((e && e.message) || e); }
    if (!r){ check('Music', false, s + ': could not be rendered' + (err ? ' (' + err + ')' : ' in this browser')); continue; }
    levels[s] = { full: +r.full.db.toFixed(1), phone: +r.phone.db.toFixed(1), peak: +r.full.peak.toFixed(3) };
    check('Music', !r.full.bad && r.full.db > -40, s + ': silent or broken sound');
    check('Music', r.full.peak <= 1.001, s + ': the sound clips');
    check('Music', r.phone.db >= LOUD[0] && r.phone.db <= LOUD[1], s + ': ' + r.phone.db.toFixed(1) + ' dB on a phone speaker, outside ' + LOUD[0] + ' to ' + LOUD[1]);
  }
  return { total: results.length, failed: results.filter(r => !r.ok), results, levels };
}
const ABOUT = { Buttons: 'every button has a dance or a groove behind it, on the right page', Moves: 'poses stay in range and on stage, and loop cleanly', Music: 'each style renders clean and equally loud for a phone speaker' };
function showReport(res){
  const list = $('reportList'), sum = $('reportSum'), groups = {}, bad = res.failed.length;
  const el = (tag, text) => { const x = document.createElement(tag); x.textContent = text; return x; };
  for (const r of res.results){ const g = groups[r.group] || (groups[r.group] = { n: 0, bad: [] }); g.n++; if (!r.ok) g.bad.push(r.note); }
  list.textContent = '';
  for (const name in groups){
    const g = groups[name], li = document.createElement('li');
    if (g.bad.length) li.className = 'bad';
    li.append(el('b', g.bad.length ? '✗' : '✓'), el('span', name + ': ' + (g.n - g.bad.length) + ' of ' + g.n + ' passed'));
    for (const note of g.bad.length ? g.bad : [ABOUT[name] || '']) li.append(el('small', note));
    list.append(li);
  }
  sum.textContent = bad ? bad + ' of ' + res.total + ' checks failed' : 'All ' + res.total + ' checks passed';
  sum.className = 'sum ' + (bad ? 'bad' : 'ok');
  $('report').hidden = false; $('reportClose').focus();
}
window.ceoDanceSelfTest = selfTest;

/* ---------- controls ---------- */
$('start').addEventListener('click', startShow);
$('encore').addEventListener('click', startShow);
cv.addEventListener('click', e => {
  if (!started){ startShow(); return; }
  const r = cv.getBoundingClientRect();
  burst((e.clientX - r.left - ox) / S, (e.clientY - r.top) / S, 26, 260, TAU, 0);
  if (beat >= DROP + .5 && tapHop === 0 && phase === 'move') tapHopV = 250;
  cheer();
});
pills.forEach(el => el.addEventListener('click', () => { pickStyle(el.dataset.style); tabHold = idleT + 8; if (!started) startShow(); else initAudio(); }));
chips.forEach(el => el.addEventListener('click', () => { pickMove(el.dataset.move); if (!started) startShow(); else initAudio(); }));
tabs.forEach(el => el.addEventListener('click', () => { tab = el.dataset.tab; tabHold = idleT + 8; updateUi(); }));   // browsing by hand: hold the page a while
$('autodj').addEventListener('click', () => {    // off: stay on the style that is playing
  if (!started){ startShow(); return; }
  pickStyle(autoDJ ? sec.style : 'auto'); initAudio(); updateUi();
});
$('automix').addEventListener('click', () => {   // off: keep doing the move he is doing
  if (!started){ startShow(); return; }
  if (mode === 'auto'){ mode = manualMove = moveName; sw = null; } else pickMove('auto');
  initAudio(); updateUi();
});
$('test').addEventListener('click', async () => {
  const bt = $('test'); if (bt.disabled) return;
  bt.disabled = true; bt.textContent = 'Testing';
  let res;
  try { res = await selfTest(); }
  catch (err){ const r = { group: 'Self-test', ok: false, note: 'stopped early: ' + String((err && err.message) || err) }; res = { total: 1, failed: [r], results: [r], levels: {} }; }
  bt.disabled = false; bt.textContent = 'Test'; showReport(res);
});
$('reportClose').addEventListener('click', () => { $('report').hidden = true; $('test').focus(); });
$('tempo').addEventListener('input', e => { bpm = +e.target.value; $('bpm').textContent = String(bpm); });
$('sound').addEventListener('click', () => {
  muted = !muted;
  const s = $('sound'); s.setAttribute('aria-pressed', String(!muted)); s.textContent = muted ? 'Sound off' : 'Sound on';
  if (outGain) outGain.gain.setTargetAtTime(muted ? 0 : OUT, ac.currentTime, .03);
  if (started) initAudio();
  uiKey = '';
});
// phones pause audio after an app switch, a call or dictation: any tap wakes it again
const wake = () => { if (started && !muted) initAudio(); };
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, wake, true);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && started && !muted && ac && ac.state !== 'running'){ const pr = ac.resume(); if (pr && pr.catch) pr.catch(() => {}); }
  uiKey = '';
});

if (location.hash === '#selftest') $('test').click();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
