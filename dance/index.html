<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dance Stage</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen stage toy. The stage canvas takes all spare height, control deck docked below. */
  --night:#0F0920;
  --deck:#1A0E33;
  --line:#3B2866;
  --coral:#FF5D5D;
  --sun:#FFD23F;
  --aqua:#3DE0D0;
  --paper:#F3EEFF;
  --muted:#B1A3D6;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.app{height:100%;min-height:640px;max-width:880px;margin:0 auto;display:flex;flex-direction:column}

.stage{position:relative;flex:1 1 auto;min-height:280px;margin:12px 16px 0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#0B0619}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hud{position:absolute;top:10px;left:10px;display:flex;align-items:center;padding:7px 9px;border-radius:999px;background:rgba(15,9,32,.74);pointer-events:none}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
.go{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:68px;height:68px;display:grid;place-items:center;background:var(--coral);border:0;border-radius:50%;padding:0;box-shadow:0 5px 0 #A92C3A;cursor:pointer}
.go svg{width:32px;height:32px;margin-left:5px;fill:#2A0B14}
.go:active{transform:translate(-50%,3px);box-shadow:0 2px 0 #A92C3A}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);margin:0;font-size:12px;font-weight:600;color:var(--paper);background:rgba(15,9,32,.74);padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap}
.hint.warn{background:var(--coral);color:#2A0B14}
.mini{position:absolute;top:8px;right:8px;font:600 12px/1 var(--body);color:var(--muted);background:rgba(15,9,32,.74);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer}
.mini:disabled{opacity:.6;cursor:default}
.report{position:absolute;inset:8px;z-index:2;display:flex;flex-direction:column;gap:8px;padding:14px;border:2px solid var(--line);border-radius:12px;background:rgba(15,9,32,.96);font-size:13px;line-height:1.4;overflow:auto}
.report h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0;color:var(--sun)}
.report .sum{margin:0;font-weight:700}
.report .sum.ok{color:var(--aqua)}
.report .sum.bad{color:var(--coral)}
.report ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.report li{display:grid;grid-template-columns:1.2em 1fr;gap:0 6px}
.report li b{color:var(--aqua)}
.report li.bad b{color:var(--coral)}
.report li small{grid-column:2;color:var(--muted);font-size:12px}
.report .btn{align-self:flex-start}

.deck{padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px}
.autos{display:grid;grid-template-columns:1fr 46px 1fr 46px;gap:6px}
.autos > *{min-height:34px}
.skip{display:grid;place-items:center;padding:0;color:var(--paper)}
.skip svg{width:17px;height:17px;fill:currentColor}
.skip:active{background:var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{position:relative;flex:1 1 17%;min-width:0;font:700 13px/1.1 var(--body);color:var(--muted);background:transparent;border:0;border-bottom:3px solid var(--line);min-height:34px;padding:4px 2px;cursor:pointer}
.tab[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--coral)}
.styles,.moves{transform-origin:50% 0}
.flip{animation:flip .28s ease-out}
@keyframes flip{from{transform:perspective(520px) rotateX(-80deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .flip{animation:none} }
@media (max-height:680px){ .stage{min-height:240px} }
.styles{display:flex;gap:6px;min-height:32px}
.moves{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:34px;gap:6px;min-height:74px}
.pill,.chip,.btn{position:relative;font:600 13px/1.1 var(--body);color:var(--paper);background:var(--deck);border:2px solid var(--line);cursor:pointer;padding:6px 4px}
.pill,.chip{font-size:12px;padding:4px 2px}
.pill{flex:1 1 auto;min-width:0;padding:4px 6px;white-space:nowrap;border-radius:999px;min-height:32px;background:transparent}
.pill[aria-pressed="true"]{background:var(--aqua);border-color:var(--aqua);color:#04201D}
.chip{border-radius:10px;min-height:34px}
.chip[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#221300}
.live::after{content:"";position:absolute;top:-4px;right:-4px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--night)}
.tab.live::after{top:3px;right:5px}
.btn{border-radius:10px;min-height:38px;padding:6px 12px;white-space:nowrap}
.btn[aria-pressed="false"]{color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:8px}
.tempo{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;color:var(--muted)}
.tempo output{color:var(--paper);font-variant-numeric:tabular-nums;min-width:3ch}
.tempo input{flex:1 1 auto;min-width:60px;accent-color:var(--sun)}
button:focus-visible,input:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
@media (min-width:640px){
  .moves{grid-template-columns:repeat(10,1fr);min-height:34px}
  .tab{flex:1 1 0}
}
@media (max-width:379px){
  .tab{font-size:12.5px}
  .pill{font-size:11px;padding:4px}
  .chip{font-size:11.5px}
}
@media (max-width:339px){
  .tab{font-size:11.5px}
  .pill{font-size:10.5px;padding:4px 2px}
}
</style>
</head>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const PI = Math.PI, TAU = PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const frac = v => v - Math.floor(v);
const mod = (a, n) => ((a % n) + n) % n;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function resize(){

  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  S = Math.min(cw / VW, ch / 470); ox = (cw - VW * S) / 2; VH = ch / S;
  X0 = -ox / S; X1 = (cw - ox) / S; FLOOR = VH - 140;
}

function blendKeys(p, A, B, k){ for (const f in B) p[f] = lerp(A[f], B[f], k); }
function discoKey(i){

  const k = up ? { aS:2.5, aE:.1, x:-9, lean:-.08, head:-.1, turn:.8 } : { aS:-.45, aE:-.2, x:9, lean:.08, head:.12, turn:-.5 };
  return mir ? { lS:k.aS, lE:k.aE, rS:.8, rE:-1.45, x:-k.x, lean:-k.lean, head:-k.head, turn:-k.turn }
             : { rS:k.aS, rE:k.aE, lS:.8, lE:-1.45, x:k.x, lean:k.lean, head:k.head, turn:k.turn };
}
const ROBO = [
  { lS:PI/2, lE:PI/2,  rS:PI/2, rE:-PI/2, head:.2,  lean:0,   x:0,  turn:-1 },
  { lS:PI/2, lE:-PI/2, rS:PI/2, rE:PI/2,  head:-.2, lean:0,   x:0,  turn:1 },

function flossKey(i){                           // straight arms swing one way while the hips swing the other
  const dir = mod(i, 2) === 0 ? -1 : 1;
  const k = { x:-dir * 12, lean:dir * .05, head:-dir * .06, turn:dir * .45, lE:.04, rE:.04 };
  if (dir > 0){ k.rS = .62; k.lS = -.8; } else { k.lS = .62; k.rS = -.8; }

function runMan(t, p, d){                        // running man, side on: one knee comes up and its foot lands in front while the other slides back; t counts steps, d is the way he faces
  const f = frac(t), L = Math.floor(t) % 2 === 0, a = Math.cos(PI * f) * (L ? 1 : -1);
  const lift = 20 * Math.sin(PI * f), zF = lerp(-1.1, 1.1, ease(f)), zO = lerp(1.1, -1.1, ease(clamp((f - .5) / .5, 0, 1)));
  p.yaw = d * 1; p.pitch = .1; p.lfx = -5; p.rfx = 5; p.y = -5 - 5 * dip(2 * t); p.lToe = p.rToe = .2; p.lK = p.rK = .3;
  if (L){ p.lfy = lift; p.lz = zF; p.rz = zO; } else { p.rfy = lift; p.rz = zF; p.lz = zO; }
  p.lF = p.rF = 1; p.lS = .55 * a; p.rS = -.55 * a; p.lE = p.rE = 1.25; p.head = .04 * a;      // the arms pump against the legs

function tStep(g, d, p){                         // T-step: one foot taps out while the other swivels heel and toe; g counts taps, d is the direction
  const h = frac(g), even = Math.floor(g) % 2 === 0, lift = 12 * Math.sin(PI * h), out = lerp(24, 13, Math.sin(PI * h)), a = Math.sin(PI * g);
  p.y = -6 - 4 * dip(g); p.turn = d * .7; p.lean = d * .05;
  if (d > 0){ p.rfx = out; p.rfy = lift; p.rK = .3; p.lfx = -8; p.lToe = even ? .9 : -.7; p.rToe = .8; }
  else { p.lfx = -out; p.lfy = lift; p.lK = .3; p.rfx = 8; p.rToe = even ? .9 : -.7; p.lToe = .8; }
  p.lS = .95 + .3 * a; p.rS = .95 - .3 * a; p.lE = p.rE = .45;
}

  p.lS = p.rS = .1; p.lE = p.rE = .04; p.pointe = .6; p.lfx = -6; p.rfx = 6; p.lToe = p.rToe = .5; p.lK = p.rK = .3; p.mouth = .3; p.brow = .3;

const MOVES = {
  bounce(b, p){
    const s = Math.sin(PI * b), sway = Math.sin(PI * b / 2);
    p.x = 10 * sway; p.y = -8 * dip(b); p.lean = .06 * sway; p.head = .09 * s; p.turn = .5 * sway;
    p.lS = .55 + .32 * s; p.lE = 1.2 + .35 * s; p.rS = .55 - .32 * s; p.rE = 1.2 - .35 * s;
    const up = Math.sin(PI * frac(b)) * 7;
    if (Math.floor(b) % 2 === 0){ p.lfy = up; p.lK = .2; } else { p.rfy = up; p.rK = .2; }
  },
  disco(b, p){
    const i = Math.floor(b);
    blendKeys(p, discoKey(i - 1), discoKey(i), easeOut(frac(b) / .3));
    p.y = -7 * dip(b);
  },
  jump(b, p){
    const air = Math.sin(PI * frac(b)), s = Math.sin(PI * b);
    p.y = 28 * air; p.lfy = p.rfy = 23 * air;
    p.lS = 2.6 + .3 * s; p.rS = 2.6 - .3 * s; p.lE = p.rE = .25;
    p.lean = .08 * s; p.head = .08 * s; p.mouth = .9; p.face = 'joy';
    const sq = Math.pow(dip(b), 6); p.sy = 1 - .08 * sq; p.sx = 1 + .05 * sq;
  },
  wave(b, p){
    const f = PI * b;
    p.y = -5 * dip(b); p.x = 7 * Math.sin(f / 2);
    p.lean = .09 * Math.sin(f - 1.6); p.head = .14 * Math.sin(f - 1.6); p.turn = .7 * Math.sin(f - 1.6);
    p.lS = PI / 2 + .5 * Math.sin(f - .8); p.lE = .75 * Math.sin(f + .4);
    p.rS = PI / 2 + .5 * Math.sin(f - 2.4); p.rE = .75 * Math.sin(f - 3.6);
  },
  robot(b, p){
    const i = Math.floor(b), n = ROBO.length;
    blendKeys(p, ROBO[mod(i - 1, n)], ROBO[mod(i, n)], easeOut(frac(b) / .18));

function drawCrowd(b, t){

function drawHead(p, yc, ys, cyS, mir){             // yc, ys, cyS: how far round the head is (cyS below zero from behind); mir: the body is being drawn as its mirror image
  // The head is a ball. As it turns each feature rides round to where it would really be, narrows as it nears the edge and goes out of sight behind it,
  // so side on there is one eye, a nose and an ear, and from behind there is hair.
  const sgn = ys >= 0 ? 1 : -1, kb = cyS < 0 ? yc : 0;
  const on = (x, R) => { const s = clamp(x / R, -1, 1), c = Math.sqrt(1 - s * s); return [R * (s * cyS + c * ys), c * cyS - s * ys]; };   // [where it lands, how much of its width shows]

  oval(earL[0], 1.5, 3.6, 5.2, 0, SKD); oval(earR[0], 1.5, 3.6, 5.2, 0, SKD);
  if (cyS > -.35) oval(20.5 * ys, 4.8, 3.4, 3, 0, SK);            // the nose stands out past the cheek once he is side on
  ctx.fillStyle = SK; headPath(); ctx.fill();

  // one the only hair to see is the short dark sides below its edge, the same from the front, the side and behind

  if (fluff > .02){
    for (const c of [[-56, -5, 6.2, HAIRD], [-19, -3.5, 7, HAIRD], [19, -3.5, 7, HAIRD], [56, -5, 6.2, HAIRD], [-38, -10.5, 7, HAIR], [0, -9.5, 7.5, HAIR], [38, -10.5, 7, HAIR]]){
      const an = c[0] * PI / 180, sa = Math.sin(an), ca = Math.cos(an), w = -(ca * cyS - sa * ys);

    }
    for (const c of [[-14, -15, 6.5], [-5, -21, 7.5], [6, -22, 7.5], [14, -16, 6.5]]) oval(c[0], c[1], c[2] * fluff, c[2] * fluff, 0, HAIRD);
    for (const c of [[-10, -18, 6.5], [0, -23.5, 7.5], [10, -19, 6.5], [-16, -10, 4.5], [16, -11, 4.5]]) oval(c[0], c[1], c[2] * fluff, c[2] * fluff, 0, HAIR);
  }

    ctx.save(); ctx.globalAlpha = Math.min(1, wear.hat * 1.5); ctx.translate(0, -26 * (1 - wear.hat));
    ctx.fillStyle = '#4B2E1E'; rr(-22, -40, 44, 27, 11); ctx.fill();

      ctx.quadraticCurveTo(6, 12 + d, 0, 12.6 + d); ctx.quadraticCurveTo(-6, 12 + d, -7.5, 10.8); ctx.fill();
      ctx.fillStyle = WHITE; ctx.beginPath(); ctx.moveTo(-6, 11.4); ctx.quadraticCurveTo(0, 12.9, 6, 11.4);
      ctx.lineTo(5.2, 13.5); ctx.quadraticCurveTo(0, 14.8, -5.2, 13.5); ctx.closePath(); ctx.fill();

  if (me[1] > .2 || mic[1] > .32){

    ctx.strokeStyle = '#1B1230'; ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(me[0] * .97, 1); ctx.quadraticCurveTo(me[0] * .95, 13, bx, 15); ctx.stroke();

}

function drawTutu(x, y, rot, front){
  if (wear.tutu < .03) return;
  ctx.save(); ctx.translate(x, y + hairY * .5); ctx.rotate(rot); ctx.scale(wear.tutu, wear.tutu);
  const rx = 46, ry = 11;
  if (!front){ oval(0, 0, rx, ry, 0, '#E6BFD6'); ctx.restore(); return; }      // back rim, behind the legs
  ctx.fillStyle = '#FFD9EC'; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, PI); ctx.lineTo(-15, -6); ctx.lineTo(15, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFF3FA';
  for (let k = 0; k <= 8; k++){ const a = k * PI / 8; ctx.beginPath(); ctx.arc(rx * Math.cos(a), ry * Math.sin(a) + 1, 5, 0, TAU); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(0, -1, rx * .78, ry * .7, 0, 0, PI); ctx.lineTo(-14, -6); ctx.lineTo(14, -6); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawDancer(p, ax, ay){
  const { HIP, T } = D;
  // A turn is drawn in the round, not as a flat card: joints close in on the body's axis, limbs and head keep their thickness,
  // the torso narrows only to its depth, and whatever sits on the chest, the back or the face slides round to the edge.
  const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw), back = cy < 0, sg = back ? -1 : 1;
  const yc = Math.abs(cy), ys = sy * sg, yw = Math.sqrt(cy * cy + .38 * sy * sy);      // r to the side and z to the front of the axis lands at r * yc + z * ys
  ctx.save();
  ctx.translate(ax, ay);
  ctx.scale(D.SCALE * p.sx, D.SCALE * p.sy);
  if (p.tilt){ ctx.translate(0, -6); ctx.rotate(p.tilt); ctx.translate(0, 6); }      // a lean from the ankles: the shoes stay flat on the floor
  ctx.scale(sg, 1);                                                                  // seen from behind he is a mirror image
  const hx = p.x * yc, hy = -(HIP + p.y);
  if (p.rot){ ctx.translate(hx, hy - 25); ctx.rotate(p.rot); ctx.translate(-hx, -(hy - 25)); }
  const ux0 = Math.sin(p.lean) * yc + Math.sin(p.pitch) * ys, uy0 = -Math.cos(p.lean);  // spine "up"; pitch bends him forward, which shows once he is side on
  // The spine flexes at the waist: the chest turns one way and the hips the other. bend is to the side and shows from the front; curl is forward (or, below zero, an arched back) and shows side on
  const fl = (p.bend * yc + p.curl * ys) / 2, cf = Math.cos(fl), sf = Math.sin(fl);
  const ux = ux0 * cf - uy0 * sf, uy = ux0 * sf + uy0 * cf, wx = ux0 * cf + uy0 * sf, wy = -ux0 * sf + uy0 * cf;      // "up" for the chest and for the hips
  const aS = p.lean + p.shTilt + fl, aH = p.lean * .3 + p.hipTilt - fl;
  const sxv = Math.cos(aS), syv = Math.sin(aS), hxv = Math.cos(aH), hyv = Math.sin(aH);   // shoulder line and hip line
  const Cx = hx + (wx + ux) * T / 2, Cy = hy + (wy + uy) * T / 2;             // top of the chest
  // (r, u): r along the hip or shoulder line, u up the spine. No z: on the outline. z: that far in front of the body's axis (0 for a joint).
  const at = (bx, by, vx, vy, px, py) => (r, u, z) => { const q = z === undefined ? r * yw : r * yc + z * ys; return [bx + vx * q + px * u, by + vy * q + py * u]; };
  const HP = at(hx, hy, hxv, hyv, wx, wy), CP = at(Cx, Cy, sxv, syv, ux, uy);
  const zC = r => 11.5 * Math.sqrt(Math.max(0, 1 - r * r / 484));            // how far the chest stands out at r
  const shL = CP(-20, -3, 0), shR = CP(20, -3, 0);

  const lB = p.lBack || ys < -.3, rB = p.rBack || ys > .3;      // once he has turned, the arm on the far side passes behind the body
  let hand = null;
  if (lB) drawArm(-1, p.lS, p.lE, shL[0], shL[1], yc, ys, p.lF);
  if (rB) hand = drawArm(1, p.rS, p.rE, shR[0], shR[1], yc, ys, p.rF);

  const hipL = HP(-9.5, 0, 0), hipR = HP(9.5, 0, 0), ct = Math.cos(p.tilt), st = Math.sin(p.tilt);
  const leg = (hip, side, fx, fyUp, k, toe, z, heel, onToe) => {
    const pt = Math.max(p.pointe, onToe), wx = sg * (fx * yc + 12 * z * ys), wy = -fyUp - 7 * pt;      // where the ankle is before the body tips, measured from the ankle pivot
    drawLeg(hip[0], hip[1], sg * (wx * ct + wy * st), -6 - wx * st + wy * ct, side, k * yc + side * Math.sqrt(Math.max(0, 1 - k * k)) * ys,
      side * toe * yc + 1.1 * ys, fyUp, z * yc, pt, heel, -p.tilt * sg);
  };
  const legL = () => leg(hipL, -1, p.lfx, p.lfy, p.lK, p.lToe, p.lz, p.lHeel, p.lPt), legR = () => leg(hipR, 1, p.rfx, p.rfy, p.rK, p.rToe, p.rz, p.rHeel, p.rPt);
  drawTutu(hx + wx * 5, hy + wy * 5, aH, false);
  if (9.5 * sy + 12 * p.lz * cy <= -9.5 * sy + 12 * p.rz * cy){ legL(); legR(); } else { legR(); legL(); }      // the leg nearer the audience goes on top
  oval(hx - wx * 2, hy - wy * 2, 16 * Math.sqrt(cy * cy + .45 * sy * sy), 9.5, aH, LEGC);

  // jacket
  const J = [HP(-17.5, -8), HP(-15, 14), CP(-21, -12), CP(-25, 4), CP(-17, 4), CP(-7, 5), CP(7, 5), CP(17, 4), CP(25, 4), CP(21, -12), HP(15, 14), HP(17.5, -8), HP(0, -11)];
  ctx.fillStyle = SUIT; ctx.strokeStyle = SUIT; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(J[0][0], J[0][1]); ctx.lineTo(J[1][0], J[1][1]); ctx.lineTo(J[2][0], J[2][1]);
  ctx.quadraticCurveTo(J[3][0], J[3][1], J[4][0], J[4][1]); ctx.lineTo(J[5][0], J[5][1]); ctx.lineTo(J[6][0], J[6][1]); ctx.lineTo(J[7][0], J[7][1]);
  ctx.quadraticCurveTo(J[8][0], J[8][1], J[9][0], J[9][1]); ctx.lineTo(J[10][0], J[10][1]); ctx.lineTo(J[11][0], J[11][1]);
  ctx.quadraticCurveTo(J[12][0], J[12][1], J[0][0], J[0][1]); ctx.closePath(); ctx.fill(); ctx.stroke();

  // neck
  const ha = p.lean * .5 + p.head + fl, hcx = Cx + ux * 3 + Math.sin(ha) * 27 * yc, hcy = Cy + uy * 3 - Math.cos(ha) * 27;
  cap(Cx + ux * 2, Cy + uy * 2, 5.4, hcx, hcy, 5, SKD);

    ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(hem[0], hem[1]); ctx.stroke();
    ctx.lineWidth = 4; const cl = CP(-8, 5, -zC(8)), cr = CP(8, 5, -zC(8));

  } else {
    // shirt, tie, lapels, button and pocket square
    const nl = CP(-7, 5, zC(7)), nr = CP(7, 5, zC(7)), vt = HP(0, 22, 11.5), kn = CP(0, 1, 11.5), hem = HP(0, -10, 9.6), bt = HP(0, 15, 11);
    ctx.fillStyle = C.paper; ctx.beginPath(); ctx.moveTo(nl[0], nl[1]); ctx.lineTo(nr[0], nr[1]); ctx.lineTo(vt[0], vt[1]); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = SUITD; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(nl[0], nl[1]); ctx.lineTo(vt[0], vt[1]); ctx.lineTo(nr[0], nr[1]); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(vt[0], vt[1]); ctx.lineTo(hem[0], hem[1]); ctx.stroke();
    oval(bt[0], bt[1], 1.8, 1.8, 0, SUITD);
    const pk = CP(-14, -13, zC(14)), tw = Math.max(.3, yc);
    ctx.fillStyle = C.aqua; ctx.beginPath(); ctx.moveTo(pk[0] - 3.5 * tw, pk[1] + 1.5); ctx.lineTo(pk[0], pk[1] - 3.5); ctx.lineTo(pk[0] + 3.5 * tw, pk[1] + 1.5); ctx.closePath(); ctx.fill();
    if (wear.cowboy > .5){                                         // sheriff's star for the country numbers
      const sb = CP(13, -14, zC(13)); ctx.fillStyle = C.sun; ctx.beginPath();
      for (let i = 0; i < 10; i++){ const r = i % 2 ? 2.5 : 5.8, an = -PI / 2 + i * PI / 5; ctx.lineTo(sb[0] + r * tw * Math.cos(an), sb[1] + r * Math.sin(an)); }
      ctx.closePath(); ctx.fill();
    }
    // The tie goes on last, so that when it swings it flies out over the lapel instead of sliding under it. It hangs toward the floor however he is tipped or
    // turned over, but it is cloth on a body: side on it cannot swing back through his chest, and where there is no room under him it drapes along the floor
    const tipd = p.rot + p.tilt, wrap = a => mod(a + PI, TAU) - PI, down = Math.atan2(ux, -uy) + tipd;      // down: the way his chest runs, collar to belt
    let th = wrap(p.lean + tieA), rel = wrap(th - down);
    const bk = rel * Math.sign(ys), lim = (1 - Math.abs(ys)) * PI / 2;      // bk above zero: it has swung round behind him; it may only do that as far as he is turned to face us
    if (bk > lim && bk < PI - lim) th = wrap(down + Math.sign(ys) * (bk < 2 ? lim : PI - lim));      // so it falls back along his chest, toward the belt or, upside down, toward the collar
    const cr = Math.cos(p.rot), sr = Math.sin(p.rot), kx = hx + (kn[0] - hx) * cr - (kn[1] - hy + 25) * sr, ky = hy - 25 + (kn[0] - hx) * sr + (kn[1] - hy + 25) * cr;
    const room = (6 - (kx * st + (ky + 6) * ct) - 2) / 28;      // how high the knot is above the floor, in tie lengths
    if (room < Math.cos(th)) th = (Math.sin(down) < 0 ? -1 : 1) * Math.acos(clamp(room, -1, 1));
    ctx.save(); ctx.translate(kn[0], kn[1]); ctx.rotate(th - tipd); ctx.scale(Math.max(.25, yc), 1); ctx.fillStyle = C.sun;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(3.6, 3); ctx.lineTo(0, 6); ctx.lineTo(-3.6, 3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2.2, 5); ctx.lineTo(2.2, 5); ctx.lineTo(4.8, 21); ctx.lineTo(0, 26); ctx.lineTo(-4.8, 21); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  drawTutu(hx + wx * 5, hy + wy * 5, aH, true);
  const arms = () => { if (!lB) drawArm(-1, p.lS, p.lE, shL[0], shL[1], yc, ys, p.lF); if (!rB) hand = drawArm(1, p.rS, p.rE, shR[0], shR[1], yc, ys, p.rF); };
  const hyaw = p.yaw + .32 * p.turn, hc = Math.cos(hyaw);        // the head turns a little further than the body when he looks to one side, and its hat and hair go with it
  const head = () => { ctx.save(); ctx.translate(hcx, hcy); ctx.rotate(ha); drawHead(p, Math.abs(hc), Math.sin(hyaw) * sg, hc, back); ctx.restore(); };
  if (p.over){ head(); arms(); } else { arms(); head(); }          // in a dab the arm crosses in front of the face
  if (p.rope !== null && hand) drawRope(hand[0], hand[1], p.rope);
  if (p.tamb !== null && hand) drawTamb(hand[0], hand[1], p.tamb);
  ctx.restore();
}

/* ---------- confetti and dust ---------- */
function burst(x, y, n, pow, spread, dir){
  if (reduce) n = Math.ceil(n / 3);
  const cols = STYLES[sec.style].cols.concat(C.paper);
  for (let i = 0; i < n && parts.length < 280; i++){
    const a = dir + (Math.random() - .5) * spread, v = pow * (.4 + Math.random() * .8);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * TAU, vr: (Math.random() - .5) * 14,
                 w: 4 + Math.random() * 4, h: 6 + Math.random() * 5, c: cols[i % cols.length], life: 2.2 + Math.random() * 1.2 });
  }
}
function puff(x, y){ for (let i = 0; i < 6; i++) puffs.push({ x: x + (i - 2.5) * 11, y, vx: (i - 2.5) * 16, r: 5 + Math.random() * 5, life: .5 }); }
function drawPuffs(dt){
  for (let i = puffs.length - 1; i >= 0; i--){
    const q = puffs[i]; q.life -= dt; if (q.life <= 0){ puffs.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y -= 12 * dt; q.r += 26 * dt;
    ctx.fillStyle = `rgba(243,238,255,${.35 * q.life / .5})`; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
  }
}
function drawConfetti(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const q = parts[i];
    q.life -= dt; if (q.life <= 0 || q.y > VH + 20){ parts.splice(i, 1); continue; }
    q.vy += 420 * dt; q.vx *= 1 - 1.2 * dt; q.vy *= 1 - .9 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt; q.r += q.vr * dt;
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.scale(1, Math.cos(q.r * 1.7));
    ctx.globalAlpha = Math.min(1, q.life); ctx.fillStyle = q.c; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

      else if (Math.abs(p.x) > 40 || p.y < (p.rot ? -100 : -60) || p.y > 80 || Math.abs(p.lfx * Math.cos(p.yaw)) > 90 || Math.abs(p.rfx * Math.cos(p.yaw)) > 90 || Math.abs(p.lean) > .6) why = 'the pose is out of range at beat ' + b;
    }
    if (!why){ const a = poseAt(m, 0), z = poseAt(m, 16); if (Math.abs(a.tx - z.tx) > .01 || NUM.some(x => Math.abs(a.p[x] - z.p[x]) > .01)) why = 'the loop jumps after 16 beats'; }
    check('Moves', !why, m + ': ' + why);
  }
  for (const kind of KINDS) for (const par of [false, true]){
    let ok = true;
    for (let q = 0; q <= 1; q += .05){ const p = basePose(); TRANS[kind](q, p, par); if (NUM.some(x => !isFinite(p[x]))) ok = false; }
    check('Moves', ok, 'the "' + kind + '" flourish breaks the pose');
  }
  // 3. each music style, rendered offline: it makes sound, has no broken samples, does not clip, and is as loud as the others on a phone speaker
  for (const s in STYLES){
    let r = null, err = '';
    try { r = await renderStyle(s, 2); } catch (e){ err = String((e && e.message) || e); }
    if (!r){ check('Music', false, s + ': could not be rendered' + (err ? ' (' + err + ')' : ' in this browser')); continue; }
    levels[s] = { full: +r.full.db.toFixed(1), phone: +r.phone.db.toFixed(1), peak: +r.full.peak.toFixed(3) };
    check('Music', !r.full.bad && r.full.db > -40, s + ': silent or broken sound');
    check('Music', r.full.peak <= 1.001, s + ': the sound clips');
    check('Music', r.phone.db >= LOUD[0] && r.phone.db <= LOUD[1], s + ': ' + r.phone.db.toFixed(1) + ' dB on a phone speaker, outside ' + LOUD[0] + ' to ' + LOUD[1]);
  }
  return { total: results.length, failed: results.filter(r => !r.ok), results, levels };
}
const ABOUT = { Buttons: 'every button has a dance or a groove behind it, on the right page', Moves: 'poses stay in range and on stage, and loop cleanly', Music: 'each style renders clean and equally loud for a phone speaker' };
function showReport(res){
  const list = $('reportList'), sum = $('reportSum'), groups = {}, bad = res.failed.length;
  const el = (tag, text) => { const x = document.createElement(tag); x.textContent = text; return x; };
  for (const r of res.results){ const g = groups[r.group] || (groups[r.group] = { n: 0, bad: [] }); g.n++; if (!r.ok) g.bad.push(r.note); }
  list.textContent = '';
  for (const name in groups){
    const g = groups[name], li = document.createElement('li');
    if (g.bad.length) li.className = 'bad';
    li.append(el('b', g.bad.length ? '✗' : '✓'), el('span', name + ': ' + (g.n - g.bad.length) + ' of ' + g.n + ' passed'));
    for (const note of g.bad.length ? g.bad : [ABOUT[name] || '']) li.append(el('small', note));
    list.append(li);
  }
  sum.textContent = bad ? bad + ' of ' + res.total + ' checks failed' : 'All ' + res.total + ' checks passed';
  sum.className = 'sum ' + (bad ? 'bad' : 'ok');
  $('report').hidden = false; $('reportClose').focus();
}
window.ceoDanceSelfTest = selfTest;

/* ---------- controls ---------- */
$('start').addEventListener('click', startShow);
$('encore').addEventListener('click', startShow);
cv.addEventListener('click', e => {
  if (!started){ startShow(); return; }
  const r = cv.getBoundingClientRect();
  burst((e.clientX - r.left - ox) / S, (e.clientY - r.top) / S, 26, 260, TAU, 0);
  if (beat >= DROP + .5 && tapHop === 0 && phase === 'move') tapHopV = 250;
  cheer();
});
pills.forEach(el => el.addEventListener('click', () => { pickStyle(el.dataset.style); tabHold = idleT + 8; if (!started) startShow(); else initAudio(); }));
chips.forEach(el => el.addEventListener('click', () => { pickMove(el.dataset.move); if (!started) startShow(); else initAudio(); }));
tabs.forEach(el => el.addEventListener('click', () => { tab = el.dataset.tab; tabHold = idleT + 8; updateUi(); }));   // browsing by hand: hold the page a while
$('autodj').addEventListener('click', () => {    // off: stay on the style that is playing
  if (!started){ startShow(); return; }
  pickStyle(autoDJ ? sec.style : 'auto'); initAudio(); updateUi();
});
$('skipdj').addEventListener('click', () => { if (!started){ startShow(); return; } skipStyle(); tabHold = 0; initAudio(); updateUi(); });
$('skipmix').addEventListener('click', () => { if (!started){ startShow(); return; } skipMove(); tabHold = 0; initAudio(); updateUi(); });
$('automix').addEventListener('click', () => {   // off: keep doing the move he is doing
  if (!started){ startShow(); return; }
  if (mode === 'auto'){ mode = manualMove = moveName; sw = null; } else pickMove('auto');
  initAudio(); updateUi();
});
$('test').addEventListener('click', async () => {
  const bt = $('test'); if (bt.disabled) return;
  bt.disabled = true; bt.textContent = 'Testing';
  let res;
  try { res = await selfTest(); }
  catch (err){ const r = { group: 'Self-test', ok: false, note: 'stopped early: ' + String((err && err.message) || err) }; res = { total: 1, failed: [r], results: [r], levels: {} }; }
  bt.disabled = false; bt.textContent = 'Test'; showReport(res);
});
$('reportClose').addEventListener('click', () => { $('report').hidden = true; $('test').focus(); });
$('tempo').addEventListener('input', e => { bpm = +e.target.value; $('bpm').textContent = String(bpm); });
$('sound').addEventListener('click', () => {
  muted = !muted;
  const s = $('sound'); s.setAttribute('aria-pressed', String(!muted)); s.textContent = muted ? 'Sound off' : 'Sound on';
  if (outGain) outGain.gain.setTargetAtTime(muted ? 0 : OUT, ac.currentTime, .03);
  if (started) initAudio();
  uiKey = '';
});
// phones pause audio after an app switch, a call or dictation: any tap wakes it again
const wake = () => { if (started && !muted) initAudio(); };
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) document.addEventListener(ev, wake, true);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && started && !muted && ac && ac.state !== 'running'){ const pr = ac.resume(); if (pr && pr.catch) pr.catch(() => {}); }
  uiKey = '';
});

if (location.hash === '#selftest') $('test').click();
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
